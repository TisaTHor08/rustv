<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
      #box { height: 100%; display: flex; align-items: center; justify-content: center; gap: 6%; }
      svg { height: 80%; width: auto; }
      .col { display: flex; flex-direction: column; line-height: 1.1; }
      #name { font-size: 36vh; font-weight: 600; }
      #pct { font-size: 28vh; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="box">
      <svg viewBox="-12 -12 24 24"><circle r="10" fill="#1b2340" stroke="rgba(255,255,255,.35)" stroke-width=".6" /><path id="lit" fill="#f1ecd2" /></svg>
      <div class="col"><div id="name"></div><div id="pct"></div></div>
    </div>
    <script src="__rustv.js"></script>
    <script>
      var SYN = 29.530588853;
      var NAMES = {
        en: ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'],
        fr: ['Nouvelle lune', 'Premier croissant', 'Premier quartier', 'Gibbeuse croissante', 'Pleine lune', 'Gibbeuse décroissante', 'Dernier quartier', 'Dernier croissant']
      };
      // Reference new moon: 2000-01-06 18:14 UTC
      function age(date) {
        var d = (date.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
        return ((d % SYN) + SYN) % SYN;
      }
      function render() {
        var a = age(new Date()), f = a / SYN;               // 0 new, 0.5 full
        var illum = (1 - Math.cos(2 * Math.PI * f)) / 2;
        var r = 10, k = Math.cos(2 * Math.PI * f) * r;       // terminator x radius (signed)
        var waxing = f < 0.5, sweepOuter = waxing ? 1 : 0;
        // Lit limb is the right side when waxing, left when waning.
        var top = '0,' + (-r), bot = '0,' + r;
        var rx = Math.abs(k).toFixed(2);
        var termSweep = (waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0));
        var d = 'M' + top + ' A' + r + ',' + r + ' 0 0 ' + sweepOuter + ' ' + bot +
                ' A' + rx + ',' + r + ' 0 0 ' + termSweep + ' ' + top + ' Z';
        document.getElementById('lit').setAttribute('d', d);
        var idx = Math.floor(f * 8 + 0.5) % 8;
        var lang = /^fr/i.test(navigator.language || '') ? 'fr' : 'en';
        document.getElementById('name').textContent = NAMES[lang][idx];
        document.getElementById('pct').textContent = Math.round(illum * 100) + '%';
      }
      render();
      setInterval(render, 600000);
    </script>
  </body>
</html>
