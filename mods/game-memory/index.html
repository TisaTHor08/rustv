<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html { font-size: calc(100vh / 54); scrollbar-width: none; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(100% 100% at 50% 0%, #5b1f6e 0%, #150a1c 75%); color: #fdeeff; overflow: hidden; }
      h1 { margin: 0 0 1rem; font-size: 4.4rem; color: #f472b6; }
      #info { font-size: 2.4rem; height: 3.4rem; color: #e9c4f3; margin-bottom: 1.4rem; }
      #grid { display: grid; gap: 1.2rem; }
      .card { width: 8rem; height: 8rem; border-radius: 1.2rem; background: #3a1a4d; border: .25rem solid #6d3a8a; display: flex; align-items: center; justify-content: center; perspective: 40rem; }
      .card svg { width: 5.4rem; height: 5.4rem; display: none; }
      .card.up { background: #fff4fb; border-color: #fff; }
      .card.up svg { display: block; }
      .card.back { background: repeating-linear-gradient(45deg, #4a2362 0 .8rem, #3a1a4d .8rem 1.6rem); }
      .card.done { background: #1f6b4a; border-color: #34d399; opacity: .85; }
      .card.cur { outline: .45rem solid #f9a8d4; outline-offset: .3rem; z-index: 1; }
      #setup { text-align: center; }
      .row { font-size: 3.2rem; margin: 1.4rem 0; padding: .8rem 3rem; border-radius: 1.2rem; min-width: 46rem; display: flex; justify-content: space-between; gap: 3rem; }
      .row.cur { background: #f472b6; color: #2a0a1f; font-weight: 700; }
      #hint { margin-top: 2rem; font-size: 2rem; color: #c79ad6; }
      kbd { background: #3a1a4d; border-radius: .5rem; padding: .1rem .7rem; color: #fff; }
    </style>
  </head>
  <body>
    <h1>Memory</h1>
    <div id="info"></div>
    <div id="setup"></div>
    <div id="grid"></div>
    <div id="hint"></div>
    <script src="__rustv.js"></script>
    <script>
      var P = function (d, extra) { return '<svg viewBox="0 0 48 48">' + d + '</svg>'; };
      var THEMES = {
        Shapes: [
          '<circle cx="24" cy="24" r="16" fill="#ef4444"/>',
          '<rect x="9" y="9" width="30" height="30" rx="4" fill="#3b82f6"/>',
          '<path d="M24 7l18 33H6z" fill="#22c55e"/>',
          '<path d="M24 5l5.5 12 13 1.5-9.7 8.8 2.7 12.9L24 33.5 12.5 40.2l2.7-12.9L5.5 18.5l13-1.5z" fill="#f59e0b"/>',
          '<path d="M24 41S6 30 6 17a10 10 0 0118-6 10 10 0 0118 6c0 13-18 24-18 24z" fill="#ec4899"/>',
          '<path d="M24 4l16 20-16 20L8 24z" fill="#06b6d4"/>',
          '<path d="M19 6h10v13h13v10H29v13H19V29H6V19h13z" fill="#8b5cf6"/>',
          '<path d="M32 6a19 19 0 100 36 15 15 0 010-36z" fill="#eab308"/>',
          '<path d="M24 5l16 9v20l-16 9-16-9V14z" fill="#14b8a6"/>',
          '<circle cx="24" cy="24" r="15" fill="none" stroke="#f97316" stroke-width="8"/>',
          '<path d="M12 12l24 24M36 12L12 36" stroke="#a3e635" stroke-width="8" stroke-linecap="round"/>',
          '<path d="M27 4L10 27h11l-3 17 20-25H26z" fill="#facc15"/>'
        ],
        Nature: [
          '<circle cx="24" cy="24" r="9" fill="#f59e0b"/><path d="M24 4v7M24 37v7M4 24h7M37 24h7M10 10l5 5M33 33l5 5M10 38l5-5M33 15l5-5" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>',
          '<path d="M30 6a18 18 0 100 36 14 14 0 010-36z" fill="#cbd5e1"/>',
          '<path d="M13 38a9 9 0 010-18 12 12 0 0122 2 8 8 0 010 16z" fill="#60a5fa"/>',
          '<path d="M24 4C16 16 10 22 10 30a14 14 0 0028 0C38 22 32 16 24 4z" fill="#38bdf8"/>',
          '<path d="M8 40C8 20 20 8 40 8c0 20-12 32-32 32z" fill="#22c55e"/><path d="M8 40L28 20" stroke="#14532d" stroke-width="3"/>',
          '<circle cx="24" cy="24" r="6" fill="#facc15"/><g fill="#f472b6"><circle cx="24" cy="11" r="7"/><circle cx="24" cy="37" r="7"/><circle cx="11" cy="24" r="7"/><circle cx="37" cy="24" r="7"/></g><circle cx="24" cy="24" r="5" fill="#facc15"/>',
          '<path d="M24 4l14 20H10z M24 16l17 22H7z" fill="#16a34a"/><rect x="21" y="38" width="6" height="7" fill="#92400e"/>',
          '<path d="M3 42L19 14l8 13 6-8 12 23z" fill="#94a3b8"/><path d="M19 14l-5 9 5-3 3 4z" fill="#fff"/>',
          '<path d="M4 20c5-6 9-6 14 0s9 6 14 0 9-6 12 0M4 32c5-6 9-6 14 0s9 6 14 0 9-6 12 0" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round"/>',
          '<path d="M24 4c8 10 14 16 14 26a14 14 0 01-28 0c0-6 3-9 6-13 1 4 3 5 5 5-2-8 0-12 3-18z" fill="#f97316"/>',
          '<g stroke="#bae6fd" stroke-width="4" stroke-linecap="round"><path d="M24 5v38M7.5 14.5l33 19M7.5 33.5l33-19"/></g>',
          '<path d="M6 24c6-10 14-12 22-8l10-8v32l-10-8c-8 4-16 2-22-8z" fill="#fb923c"/><circle cx="16" cy="22" r="2" fill="#000"/>'
        ]
      };
      var THEME_NAMES = Object.keys(THEMES);
      var SIZES = [[4, 3], [4, 4], [6, 4]];
      var opt = { size: 1, theme: 0, row: 0 };
      var phase = 'setup', cards = [], cur = 0, first = -1, lock = false, moves = 0, matched = 0, wait = 0, cols = 4;
      var $ = function (id) { return document.getElementById(id); };

      function setup() {
        phase = 'setup'; $('grid').innerHTML = ''; $('info').textContent = '';
        var rows = [['Grid', SIZES[opt.size][0] + ' x ' + SIZES[opt.size][1]], ['Theme', THEME_NAMES[opt.theme]], ['Start', '']];
        $('setup').innerHTML = rows.map(function (r, i) {
          return '<div class="row' + (i === opt.row ? ' cur' : '') + '"><span>' + (i < 2 ? '&#9664; ' : '') + r[0] + '</span><span>' + r[1] + (i < 2 ? ' &#9654;' : ' &#9654;&#9654;') + '</span></div>';
        }).join('');
        $('setup').style.display = '';
        $('hint').innerHTML = '<kbd>Up</kbd> <kbd>Down</kbd> choose &nbsp;&middot;&nbsp; <kbd>Left</kbd> <kbd>Right</kbd> change &nbsp;&middot;&nbsp; <kbd>Enter</kbd> start &nbsp;&middot;&nbsp; <kbd>Back</kbd> close';
      }
      function start() {
        var s = SIZES[opt.size]; cols = s[0];
        var n = s[0] * s[1] / 2, syms = THEMES[THEME_NAMES[opt.theme]].slice(0, n), a = [];
        syms.forEach(function (_, i) { a.push(i, i); });
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        cards = a.map(function (v) { return { v: v, up: false, done: false }; });
        cur = 0; first = -1; lock = false; moves = 0; matched = 0; phase = 'play';
        $('setup').style.display = 'none';
        $('grid').style.gridTemplateColumns = 'repeat(' + cols + ', auto)';
        $('hint').innerHTML = '<kbd>Arrows</kbd> move &nbsp;&middot;&nbsp; <kbd>Enter</kbd> flip a card &nbsp;&middot;&nbsp; <kbd>Back</kbd> close';
        draw();
      }
      function draw() {
        var th = THEMES[THEME_NAMES[opt.theme]];
        $('grid').innerHTML = cards.map(function (c, i) {
          var cls = 'card ' + (c.done ? 'up done' : c.up ? 'up' : 'back') + (i === cur && phase === 'play' ? ' cur' : '');
          return '<div class="' + cls + '">' + P(th[c.v]) + '</div>';
        }).join('');
        $('info').textContent = phase === 'won' ? 'Well done! ' + moves + ' moves - press Enter for a new game' : 'Moves ' + moves + '   Pairs ' + matched + ' / ' + cards.length / 2;
      }
      function resolve() {
        clearTimeout(wait); wait = 0;
        cards.forEach(function (c) { if (!c.done) c.up = false; });
        first = -1; lock = false; draw();
      }
      function flip() {
        var c = cards[cur];
        if (c.up || c.done) return;
        c.up = true;
        if (first < 0) { first = cur; draw(); return; }
        moves++;
        var f = cards[first];
        if (f.v === c.v) {
          f.done = c.done = true; matched++; first = -1;
          if (matched === cards.length / 2) phase = 'won';
          draw();
        } else {
          lock = true; draw();
          wait = setTimeout(resolve, 900);
        }
      }
      rustv.onKey(function (k) {
        if (phase === 'setup') {
          if (k === 'ArrowUp') opt.row = (opt.row + 2) % 3;
          else if (k === 'ArrowDown') opt.row = (opt.row + 1) % 3;
          else if (k === 'ArrowLeft' || k === 'ArrowRight') {
            var d = k === 'ArrowRight' ? 1 : -1;
            if (opt.row === 0) opt.size = (opt.size + d + SIZES.length) % SIZES.length;
            else if (opt.row === 1) opt.theme = (opt.theme + d + THEME_NAMES.length) % THEME_NAMES.length;
          } else if (k === 'Enter') return start();
          return setup();
        }
        if (phase === 'won') { if (k === 'Enter') setup(); return; }
        if (lock) { if (k === 'Enter') resolve(); return; }
        var rows = cards.length / cols, x = cur % cols, y = (cur / cols) | 0;
        if (k === 'ArrowLeft') x = (x + cols - 1) % cols;
        else if (k === 'ArrowRight') x = (x + 1) % cols;
        else if (k === 'ArrowUp') y = (y + rows - 1) % rows;
        else if (k === 'ArrowDown') y = (y + 1) % rows;
        else if (k === 'Enter') return flip();
        else return;
        cur = y * cols + x; draw();
      });
      setup();
    </script>
  </body>
</html>
