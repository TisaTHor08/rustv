<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html { font-size: calc(100vh / 54); scrollbar-width: none; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; background: radial-gradient(100% 100% at 50% 0%, #26364f 0%, #0a0f18 75%); color: #eaf1ff; overflow: hidden; }
      #bar { width: 55rem; display: flex; justify-content: space-between; align-items: baseline; font-size: 2.8rem; margin-bottom: 1.2rem; }
      #bar h1 { margin: 0; font-size: 4rem; color: #94a3b8; }
      #grid { display: grid; grid-template-columns: repeat(16, 3.2rem); grid-auto-rows: 3.2rem; gap: .25rem; }
      .c { border-radius: .5rem; background: #3a4a66; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 800; }
      .c.open { background: #121a2a; }
      .c.boom { background: #b91c1c; }
      .c.cur { outline: .4rem solid #fde047; outline-offset: -.1rem; z-index: 1; }
      .c svg { width: 2.6rem; height: 2.6rem; }
      .n1 { color: #60a5fa; } .n2 { color: #4ade80; } .n3 { color: #f87171; } .n4 { color: #a78bfa; }
      .n5 { color: #fb923c; } .n6 { color: #2dd4bf; } .n7 { color: #e5e7eb; } .n8 { color: #94a3b8; }
      #flagbtn { margin-top: 1.2rem; width: 30rem; text-align: center; font-size: 2.6rem; padding: .8rem 0; border-radius: 1.2rem; background: #263349; font-weight: 700; }
      #flagbtn.cur { outline: .4rem solid #fde047; }
      #flagbtn.on { background: #dc2626; color: #fff; }
      #hint { margin-top: .6rem; max-width: 80rem; font-size: 1.8rem; color: #8ea2c4; text-align: center; line-height: 1.6; }
      kbd { background: #263349; border-radius: .5rem; padding: .1rem .7rem; color: #fff; }
      #end { height: 3.2rem; font-size: 2.6rem; font-weight: 700; margin-top: .6rem; }
    </style>
  </head>
  <body>
    <div id="bar"><h1>Minesweeper</h1><div>Mines <b id="mines"></b> &nbsp; Time <b id="time">0</b></div></div>
    <div id="grid"></div>
    <div id="flagbtn"></div>
    <div id="end"></div>
    <div id="hint"><kbd>Arrows</kbd> move &nbsp;&middot;&nbsp; <kbd>Enter</kbd> reveal (or flag in Flag mode) &nbsp;&middot;&nbsp; <kbd>Down</kbd> on the last row selects the Flag mode button &nbsp;&middot;&nbsp; <kbd>Back</kbd> close</div>
    <script src="__rustv.js"></script>
    <script>
      var W = 16, H = 9, MINES = 20;
      var cells, cx, cy, flagMode, state, flags, t0, ticker = 0, opened;
      var $ = function (id) { return document.getElementById(id); };
      var FLAG = '<svg viewBox="0 0 24 24"><path d="M6 3v18" stroke="#e5e7eb" stroke-width="2.4" stroke-linecap="round"/><path d="M7 4l12 5-12 5z" fill="#ef4444"/></svg>';
      var MINE = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#0b0f19"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3" stroke="#0b0f19" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="10" r="1.6" fill="#fff"/></svg>';

      function newGame() {
        cells = []; for (var i = 0; i < W * H; i++) cells.push({ m: false, o: false, f: false, n: 0 });
        cx = 0; cy = 0; flagMode = false; state = 'ready'; flags = 0; opened = 0;
        clearInterval(ticker); ticker = 0; $('time').textContent = '0'; $('end').textContent = '';
        draw();
      }
      function nb(i, fn) {
        var x = i % W, y = (i / W) | 0;
        for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) {
          if (!dx && !dy) continue;
          var a = x + dx, b = y + dy;
          if (a >= 0 && b >= 0 && a < W && b < H) fn(b * W + a);
        }
      }
      function plant(safe) {
        var ban = {}; ban[safe] = 1; nb(safe, function (j) { ban[j] = 1; });
        var pool = []; for (var i = 0; i < W * H; i++) if (!ban[i]) pool.push(i);
        for (var k = 0; k < MINES; k++) { var r = Math.floor(Math.random() * pool.length); cells[pool.splice(r, 1)[0]].m = true; }
        cells.forEach(function (c, i) { var n = 0; nb(i, function (j) { if (cells[j].m) n++; }); c.n = n; });
      }
      function reveal(i) {
        var stack = [i];
        while (stack.length) {
          var j = stack.pop(), c = cells[j];
          if (c.o || c.f) continue;
          c.o = true; opened++;
          if (c.m) { state = 'lost'; continue; }
          if (c.n === 0) nb(j, function (q) { if (!cells[q].o) stack.push(q); });
        }
      }
      function act() {
        var i = cy * W + cx, c = cells[i];
        if (flagMode) {
          if (c.o) return;
          c.f = !c.f; flags += c.f ? 1 : -1;
          return;
        }
        if (c.f || c.o) return;
        if (state === 'ready') {
          plant(i); state = 'play'; t0 = Date.now();
          ticker = setInterval(function () { $('time').textContent = Math.floor((Date.now() - t0) / 1000); }, 500);
        }
        reveal(i);
        if (state === 'lost') {
          cells.forEach(function (q) { if (q.m && !q.f) q.o = true; });
          finish('Boom! Press Enter to play again');
        } else if (opened === W * H - MINES) {
          state = 'won'; finish('Cleared in ' + Math.floor((Date.now() - t0) / 1000) + ' s! Press Enter to play again');
        }
      }
      function finish(msg) { clearInterval(ticker); ticker = 0; $('end').textContent = msg; }
      function draw() {
        $('grid').innerHTML = cells.map(function (c, i) {
          var cls = 'c' + (c.o ? ' open' : '') + (c.o && c.m ? ' boom' : '') + (cy < H && i === cy * W + cx && state !== 'lost' && state !== 'won' ? ' cur' : '');
          var inner = c.f && !c.o ? FLAG : c.o ? (c.m ? MINE : c.n ? '<span class="n' + c.n + '">' + c.n + '</span>' : '') : '';
          return '<div class="' + cls + '">' + inner + '</div>';
        }).join('');
        $('mines').textContent = MINES - flags;
        var b = $('flagbtn');
        b.textContent = flagMode ? 'Flag mode: ON' : 'Flag mode: off';
        b.className = (flagMode ? 'on ' : '') + (cy === H ? 'cur' : '');
      }
      rustv.onKey(function (k) {
        if (state === 'lost' || state === 'won') { if (k === 'Enter') newGame(); return; }
        if (k === 'ArrowLeft') { if (cy < H) cx = (cx + W - 1) % W; }
        else if (k === 'ArrowRight') { if (cy < H) cx = (cx + 1) % W; }
        else if (k === 'ArrowUp') cy = cy === 0 ? H : cy - 1;      // wraps to the Flag button
        else if (k === 'ArrowDown') cy = cy === H ? 0 : cy + 1;
        else if (k === 'Enter') { if (cy === H) flagMode = !flagMode; else act(); }
        else return;
        draw();
      });
      newGame();
    </script>
  </body>
</html>
