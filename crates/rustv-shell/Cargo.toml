[package]
name = "rustv-shell"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RusTV TV shell: Tauri application (home screen, screen picker, web apps)"
build = "build.rs"
default-run = "rustv"

[[bin]]
name = "rustv"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustv-core = { path = "../rustv-core" }
rustv-protocol = { path = "../rustv-protocol" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
sevenz-rust = "0.6.1"
sha2 = "0.10"
quick-xml = "0.37"
flate2 = "1.1.11"
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
]
