[package]
name = "rustv-core"
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "RusTV core: remote-control server, input injection, pairing, Bluetooth, text-field detection"

[dependencies]
rustv-protocol = { path = "../rustv-protocol" }
base64 = "0.22"
if-addrs = "0.15"
rand = "0.8"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
png = "0.17"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Foundation",
    "Media_Control",
    "Networking_Sockets",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Linux : injection uinput et statvfs (libc, MIT/Apache) ; MPRIS sur D-Bus (zbus, MIT).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = "4"
